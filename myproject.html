<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment</title>
</head>
<body>
    <h1>Send Money via UPI</h1>
    <label for="upiId">Recipient UPI ID:</label>
    <input type="text" id="upiId" placeholder="Enter UPI ID" required>
    <br>
    <label for="amount">Amount:</label>
    <input type="number" id="amount" placeholder="Enter Amount" required>
    <br>
    <button id="payWithUPIButton">Pay with UPI</button>

    <script>
        document.getElementById('payWithUPIButton').addEventListener('click', () => {
            const upiId = document.getElementById('upiId').value;
            const amount = document.getElementById('amount').value;

            if (upiId && amount) {
                const upiLink = `upi://pay?pa=${upiId}&pn=YourName&mc=YourMerchantCode&tid=YourTransactionId&am=${amount}&cu=INR&url=YourUrl`;
                window.open(upiLink, '_blank');
            } else {
                alert('Please enter both UPI ID and amount.');
            }
        });
    </script>
</body>
</html>
